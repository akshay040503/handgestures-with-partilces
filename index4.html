<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Infinite Procedural City</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px;
            pointer-events: none; user-select: none;
            border: 1px solid rgba(255,255,255,0.2);
        }
        #controls-ui {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px;
        }
        button {
            pointer-events: auto; padding: 10px 20px; background: #222; color: white;
            border: 1px solid #555; border-radius: 4px; cursor: pointer; text-transform: uppercase;
            font-weight: bold; transition: 0.3s;
        }
        button:hover { background: #00d2ff; color: black; box-shadow: 0 0 15px #00d2ff; }
        button.cyber { border-color: #ff00ff; }
        button.cyber:hover { background: #ff00ff; box-shadow: 0 0 15px #ff00ff; }
        
        h1 { margin: 0 0 5px 0; font-size: 1.2rem; }
        p { margin: 0; font-size: 0.9rem; opacity: 0.8; }
        .key { color: #00d2ff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Infinite City Gen</h1>
        <p>Blocks: <span id="block-count">0</span> | Cars: <span id="car-count">0</span></p>
        <p>Double Click: <span class="key">Destroy Building</span></p>
        <p>Right Click: <span class="key">Pan</span> | Scroll: <span class="key">Zoom</span></p>
    </div>

    <div id="controls-ui">
        <button onclick="toggleMode()" class="cyber">Toggle Cyberpunk Mode</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Config ---
        const CHUNK_SIZE = 200; // Size of one city block area
        const BUILDING_SIZE = 10;
        const RENDER_DISTANCE = 2; // How many chunks radius to render (2 = 5x5 grid)
        const CAR_SPEED = 0.8;

        // --- Globals ---
        let scene, camera, renderer, controls, raycaster, mouse;
        let isCyberpunk = false;
        let chunks = {}; // Map "x,z" -> Chunk Object
        let lastChunkCoord = { x: 0, z: 0 };
        const particles = []; // Explosion particles

        // Materials
        let buildingMat, roadMat, carMat, carLightMat;
        let sunLight, ambientLight;

        // Colors
        const THEME = {
            day: { sky: 0x87CEEB, fog: 0xffffff, building: 0xcccccc, light: 0xffffff },
            cyber: { sky: 0x020205, fog: 0x0a0a1a, building: 0x111111, light: 0xff00ff }
        };

        init();
        animate();

        function init() {
            // 1. Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(THEME.day.sky);
            scene.fog = new THREE.FogExp2(THEME.day.fog, 0.006);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 100, 200);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below ground

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // 2. Lighting
            ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
            sunLight.position.set(100, 200, 50);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 500;
            sunLight.shadow.camera.left = -200;
            sunLight.shadow.camera.right = 200;
            sunLight.shadow.camera.top = 200;
            sunLight.shadow.camera.bottom = -200;
            scene.add(sunLight);

            // 3. Shared Materials (Performance optimization)
            buildingMat = new THREE.MeshStandardMaterial({ 
                color: THEME.day.building, 
                roughness: 0.3, 
                metalness: 0.1,
                flatShading: true
            });

            roadMat = new THREE.MeshBasicMaterial({ color: 0x222222 });

            carMat = new THREE.MeshBasicMaterial({ color: 0xff3333 }); // Tail lights
            carLightMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); // Headlights

            // 4. Initial Generation
            updateChunks();

            // 5. Events
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('dblclick', onDoubleClick);
        }

        // --- Infinite Terrain Logic ---

        function getChunkCoord(pos) {
            return {
                x: Math.floor(pos.x / CHUNK_SIZE),
                z: Math.floor(pos.z / CHUNK_SIZE)
            };
        }

        function updateChunks() {
            // Get camera's current chunk
            const center = getChunkCoord(camera.position);

            // Only update if we moved to a new chunk
            if (center.x === lastChunkCoord.x && center.z === lastChunkCoord.z && Object.keys(chunks).length > 0) return;
            lastChunkCoord = center;

            // Identify active keys
            const activeKeys = new Set();

            for (let x = -RENDER_DISTANCE; x <= RENDER_DISTANCE; x++) {
                for (let z = -RENDER_DISTANCE; z <= RENDER_DISTANCE; z++) {
                    const cx = center.x + x;
                    const cz = center.z + z;
                    const key = `${cx},${cz}`;
                    activeKeys.add(key);

                    if (!chunks[key]) {
                        chunks[key] = new CityChunk(cx, cz);
                    }
                }
            }

            // Remove old chunks (Garbage Collection)
            for (const key in chunks) {
                if (!activeKeys.has(key)) {
                    chunks[key].dispose();
                    delete chunks[key];
                }
            }
            
            // Update UI Counters
            document.getElementById('block-count').innerText = Object.keys(chunks).length;
        }

        // --- City Chunk Class ---

        class CityChunk {
            constructor(cx, cz) {
                this.cx = cx;
                this.cz = cz;
                this.group = new THREE.Group();
                this.group.position.set(cx * CHUNK_SIZE, 0, cz * CHUNK_SIZE);
                scene.add(this.group);
                
                this.buildings = [];
                this.cars = [];
                
                this.generate();
            }

            generate() {
                // 1. Ground / Road
                const groundGeo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE);
                const ground = new THREE.Mesh(groundGeo, roadMat);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.group.add(ground);

                // 2. Buildings (InstancedMesh for performance)
                const numBuildings = 60;
                const bGeo = new THREE.BoxGeometry(1, 1, 1);
                // Move pivot to bottom
                bGeo.translate(0, 0.5, 0); 
                
                const iMesh = new THREE.InstancedMesh(bGeo, buildingMat, numBuildings);
                iMesh.castShadow = true;
                iMesh.receiveShadow = true;
                
                const dummy = new THREE.Object3D();
                
                // Grid layout logic
                const gridSize = 8;
                const cellSize = CHUNK_SIZE / gridSize; // 25 units
                const roadWidth = 8;

                for (let i = 0; i < numBuildings; i++) {
                    // Random grid position
                    const gx = Math.floor(Math.random() * gridSize);
                    const gz = Math.floor(Math.random() * gridSize);
                    
                    // Position within cell (centering building, leaving margin for road)
                    const x = (gx * cellSize) - (CHUNK_SIZE/2) + (cellSize/2);
                    const z = (gz * cellSize) - (CHUNK_SIZE/2) + (cellSize/2);
                    
                    const h = Math.random() * 50 + 10; // Height 10 to 60
                    const w = cellSize - roadWidth; // Width

                    dummy.position.set(x, 0, z);
                    dummy.scale.set(w, h, w);
                    dummy.updateMatrix();
                    
                    iMesh.setMatrixAt(i, dummy.matrix);
                }
                
                iMesh.instanceMatrix.needsUpdate = true;
                this.buildingMesh = iMesh; // Store for raycasting reference
                this.group.add(iMesh);

                // 3. Traffic System (Simple moving boxes)
                const numCars = 20;
                for(let i=0; i<numCars; i++) {
                    const isHorizontal = Math.random() > 0.5;
                    const laneOffset = (Math.floor(Math.random() * gridSize) * cellSize) - (CHUNK_SIZE/2);
                    
                    const car = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 4), carMat);
                    
                    // Random start position
                    if(isHorizontal) {
                        car.position.set((Math.random()-0.5)*CHUNK_SIZE, 0.5, laneOffset + cellSize/2 - 2);
                        car.rotation.y = Math.PI / 2;
                        car.userData = { axis: 'x', speed: (Math.random() * 0.5 + 0.5) * CAR_SPEED };
                    } else {
                        car.position.set(laneOffset + cellSize/2 - 2, 0.5, (Math.random()-0.5)*CHUNK_SIZE);
                        car.userData = { axis: 'z', speed: (Math.random() * 0.5 + 0.5) * CAR_SPEED };
                    }
                    
                    this.group.add(car);
                    this.cars.push(car);
                }
            }

            update() {
                // Animate Cars
                this.cars.forEach(car => {
                    const axis = car.userData.axis;
                    car.position[axis] += car.userData.speed;

                    // Wrap around chunk
                    const limit = CHUNK_SIZE / 2;
                    if (car.position[axis] > limit) car.position[axis] = -limit;
                });
            }

            dispose() {
                scene.remove(this.group);
                // Clean up geometries/materials if strictly managing memory
                // For this demo, global materials are reused
            }
        }

        // --- Interaction: Destruction ---

        function onDoubleClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Check intersections with all chunk building meshes
            const targets = [];
            Object.values(chunks).forEach(c => {
                if(c.buildingMesh) targets.push(c.buildingMesh);
            });

            const intersects = raycaster.intersectObjects(targets);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const mesh = hit.object;
                const instanceId = hit.instanceId;

                // "Destroy" by scaling to zero (simple trick for InstancedMesh)
                const mat = new THREE.Matrix4();
                mesh.getMatrixAt(instanceId, mat);
                
                // Get position for explosion
                const position = new THREE.Vector3();
                position.setFromMatrixPosition(mat);
                
                // Scale to zero
                const dummy = new THREE.Object3D();
                dummy.position.copy(position); // keep pos
                dummy.scale.set(0,0,0); // scale zero
                dummy.updateMatrix();
                mesh.setMatrixAt(instanceId, dummy.matrix);
                mesh.instanceMatrix.needsUpdate = true;

                // Spawn Particles
                createExplosion(mesh.localToWorld(position)); // Convert local chunk pos to world
            }
        }

        function createExplosion(pos) {
            const color = isCyberpunk ? 0xff00ff : 0xffaa00;
            for(let i=0; i<30; i++) {
                const geo = new THREE.BoxGeometry(1, 1, 1);
                const mat = new THREE.MeshBasicMaterial({ color: color });
                const p = new THREE.Mesh(geo, mat);
                
                p.position.copy(pos);
                p.position.x += (Math.random()-0.5) * 10;
                p.position.y += Math.random() * 20;
                p.position.z += (Math.random()-0.5) * 10;
                
                p.userData = {
                    vel: new THREE.Vector3((Math.random()-0.5), Math.random(), (Math.random()-0.5)),
                    life: 1.0
                };
                
                scene.add(p);
                particles.push(p);
            }
        }

        // --- Environment Toggle ---

        window.toggleMode = () => {
            isCyberpunk = !isCyberpunk;
            const target = isCyberpunk ? THEME.cyber : THEME.day;

            // Tween Colors using basic lerp in loop or abrupt change
            // For simplicity, direct reassignment with some specific adjustments
            
            scene.background.setHex(target.sky);
            scene.fog.color.setHex(target.fog);
            scene.fog.density = isCyberpunk ? 0.02 : 0.006;
            
            buildingMat.color.setHex(target.building);
            buildingMat.emissive.setHex(isCyberpunk ? 0x220033 : 0x000000);
            
            if(isCyberpunk) {
                sunLight.intensity = 0.2;
                ambientLight.intensity = 1.5;
                ambientLight.color.setHex(0x8800ff);
            } else {
                sunLight.intensity = 1.5;
                ambientLight.intensity = 0.6;
                ambientLight.color.setHex(0xffffff);
            }
        };

        // --- Main Loop ---

        function animate() {
            requestAnimationFrame(animate);
            
            // 1. Logic
            updateChunks();
            
            // 2. Animate Traffic in all chunks
            for (const key in chunks) {
                chunks[key].update();
            }

            // 3. Animate Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.userData.vel);
                p.userData.vel.y -= 0.02; // Gravity
                p.rotation.x += 0.1;
                p.userData.life -= 0.02;
                p.scale.setScalar(p.userData.life);
                
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            // 4. Render
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

    </script>
</body>
</html>
